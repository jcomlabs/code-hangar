[package]
name = "hangar-fs"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
default = ["core"]
core = []
mutation = []
agent_automation = []

[dependencies]
blake3.workspace = true
hangar-core = { path = "../hangar-core" }
hangar-protect = { path = "../hangar-protect" }
walkdir.workspace = true
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_SystemServices", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
tempfile.workspace = true
